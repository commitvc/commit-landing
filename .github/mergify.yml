queue_rules:
  - name: default
    queue_conditions:
      - "check-success=build"
      - "#changes-requested-reviews-by=0"
      - or: &owner_approved
          - "approved-reviews-by=abelsamot"
          - "approved-reviews-by=olivierhuez"
          - "approved-reviews-by=0xthomass"
          - "approved-reviews-by=mxcrbn"
      - "-conflict"
      - "-draft"
    merge_conditions:
      - "check-success=build"
      - "#changes-requested-reviews-by=0"
      - or: *owner_approved
    merge_method: squash

pull_request_rules:
  - name: auto-merge owner-approved + green
    conditions:
      - base=main
      - "check-success=build"
      - "#changes-requested-reviews-by=0"
      - or: *owner_approved
      - -conflict
      - -draft
    actions:
      queue:
        name: default

  - name: comment when conflicts appear
    conditions:
      - conflict
      - -closed
    actions:
      comment:
        message: |
          @{{author}} this PR is conflicting with `main`. Rebase or merge to resolve, then I'll re-evaluate.

  - name: comment when CI fails on main
    conditions:
      - check-failure=build
      - -closed
    actions:
      comment:
        message: |
          @{{author}} the `build` check failed. PR can't auto-merge until it's green.
