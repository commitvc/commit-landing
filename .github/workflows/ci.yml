name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys are Vercel's job; these runs only validate. Superseded runs on the
# same ref are worthless, so let a new push cancel the one in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm exec playwright install --with-deps chromium

      # Playwright's webServer builds the site, which would trigger the stats
      # refresh a second time — doubling API calls, and letting the test pass
      # consume the pypistats quota that the real build then needs. The tests
      # assert the shape of the stats, not their values, so committed numbers
      # are exactly right here.
      - run: pnpm test:e2e
        env:
          SKIP_STATS_REFRESH: '1'

      # `prebuild` refreshes lib/stats.generated.ts. The token lifts the GitHub
      # API budget from 60 req/hour (unauthenticated, and one run needs ~29) to
      # 5000 — without it the refresh mostly falls back to committed values.
      # Nothing is published from here: this proves the build is green, and
      # Vercel runs its own build for the deploy that actually ships.
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
