name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Portfolio stats are baked into the bundle at build time (see
  # scripts/fetch-stats.mjs), so without a periodic rebuild they'd only move
  # when someone happens to push. Redeploy daily to keep stars / downloads
  # current. Nothing is committed by this — the numbers are re-fetched into the
  # build output, and the checked-in file stays the fallback.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# `pages` is global — without per-ref grouping, two parallel PR runs race
# each other for the deploy slot and the loser cancels. Scope the lock to
# the workflow + ref so each branch / PR has its own queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      # `prebuild` refreshes lib/stats.generated.ts. The token lifts the GitHub
      # API budget from 60 req/hour (unauthenticated, and one run needs ~29) to
      # 5000 — without it the refresh mostly falls back to committed values.
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pages artifact only matters for the deploy job. Skip the artifact
      # upload on PR runs to save a few seconds and keep the artifact tab clean.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    # Never from a PR head — PR runs validate the build but must not publish.
    # `push` covers merges; `schedule` is the daily stats refresh; and
    # `workflow_dispatch` lets a deploy be triggered by hand. All three only
    # ever run against main, which the ref check enforces.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
