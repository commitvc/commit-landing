      class Tea {
        static encrypt(r, o) {
          r = String(r);
          o = String(o);
          if (r.length == 0) {
            return "";
          }
          var n = Tea.strToLongs(Tea.utf8Encode(r));
          var m = Tea.strToLongs(Tea.utf8Encode(o).slice(0, 16));
          var q = Tea.encode(n, m);
          var l = Tea.longsToStr(q);
          var p = Tea.base64Encode(l);
          return p;
        }

        static decrypt(l, p) {
          l = String(l);
          p = String(p);
          if (l.length == 0) {
            return "";
          }
          var o = Tea.strToLongs(Tea.base64Decode(l));
          var n = Tea.strToLongs(Tea.utf8Encode(p).slice(0, 16));
          var q = Tea.decode(o, n);
          var r = Tea.longsToStr(q);
          var m = Tea.utf8Decode(r.replace(/\0+$/, ""));
          return m;
        }

        static encode(x, r) {
          if (x.length < 2) {
            x[1] = 0;
          }
          var o = x.length;
          var B = 2654435769;
          var l = Math.floor(6 + 52 / o);
          var u = x[o - 1],
            w = x[0];
          var A,
            t,
            s = 0;
          while (l-- > 0) {
            s += B;
            t = (s >>> 2) & 3;
            for (var m = 0; m < o; m++) {
              w = x[(m + 1) % o];
              A =
                (((u >>> 5) ^ (w << 2)) + ((w >>> 3) ^ (u << 4))) ^
                ((s ^ w) + (r[(m & 3) ^ t] ^ u));
              u = x[m] += A;
            }
          }
          return x;
        }

        static decode(x, r) {
          var o = x.length;
          var B = 2654435769;
          var l = Math.floor(6 + 52 / o);
          var u = x[o - 1],
            w = x[0];
          var A,
            t,
            s = l * B;
          while (s != 0) {
            t = (s >>> 2) & 3;
            for (var m = o - 1; m >= 0; m--) {
              u = x[m > 0 ? m - 1 : o - 1];
              A =
                (((u >>> 5) ^ (w << 2)) + ((w >>> 3) ^ (u << 4))) ^
                ((s ^ w) + (r[(m & 3) ^ t] ^ u));
              w = x[m] -= A;
            }
            s -= B;
          }
          return x;
        }

        static strToLongs(o) {
          var m = new Array(Math.ceil(o.length / 4));
          for (var n = 0; n < m.length; n++) {
            m[n] =
              o.charCodeAt(n * 4) +
              (o.charCodeAt(n * 4 + 1) << 8) +
              (o.charCodeAt(n * 4 + 2) << 16) +
              (o.charCodeAt(n * 4 + 3) << 24);
          }
          return m;
        }

        static longsToStr(m) {
          var o = "";
          for (var n = 0; n < m.length; n++) {
            o += String.fromCharCode(
              m[n] & 255,
              (m[n] >>> 8) & 255,
              (m[n] >>> 16) & 255,
              (m[n] >>> 24) & 255
            );
          }
          return o;
        }

        static utf8Encode(l) {
          return unescape(encodeURIComponent(l));
        }

        static utf8Decode(l) {
          try {
            return decodeURIComponent(escape(l));
          } catch (m) {
            return l;
          }
        }

        static base64Encode(l) {
          if (typeof btoa != "undefined") {
            return btoa(l);
          }
          if (typeof Buffer != "undefined") {
            return new Buffer(l, "binary").toString("base64");
          }
          throw new Error("No Base64 Encode");
        }

        static base64Decode(l) {
          if (typeof atob == "undefined" && typeof Buffer == "undefined") {
            throw new Error("No base64 decode");
          }
          try {
            if (typeof atob != "undefined") {
              return atob(l);
            }
            if (typeof Buffer != "undefined") {
              return new Buffer(l, "base64").toString("binary");
            }
          } catch (m) {
            throw new Error("Invalid ciphertext");
          }
        }
      }

      function getCurrentPath() {
        return currentDirectory;
      }

      function resolvePath(current, target) {
        if (target.startsWith("/")) {
          return target;
        }

        // Handle special directories
        if (target === ".") {
          return current;
        }
        if (target === "..") {
          const parts = current.split("/").filter(Boolean);
          parts.pop();
          return parts.length ? `/${parts.join("/")}` : "/";
        }

        // Handle relative paths with ../
        if (target.startsWith("../")) {
          const parts = current.split("/").filter(Boolean);
          parts.pop();
          const remainingPath = target.slice(3);
          return parts.length
            ? `/${parts.join("/")}/${remainingPath}`
            : `/${remainingPath}`;
        }

        return current === "/" ? `/${target}` : `${current}/${target}`;
      }

      function isValidDirectory(path) {
        const parts = path.split("/").filter(Boolean);
        let current = fileSystem["/"];

        for (const part of parts) {
          if (
            !current.contents[part] ||
            current.contents[part].type !== "directory"
          ) {
            return false;
          }
          current = current.contents[part];
        }
        return true;
      }

      function getDirectoryContent(path) {
        // Resolve the path relative to current directory
        const resolvedPath = resolvePath(currentDirectory, path);
        const parts = resolvedPath.split("/").filter(Boolean);
        let current = fileSystem["/"];

        for (const part of parts) {
          if (!current.contents[part]) {
            return null;
          }
          current = current.contents[part];
        }

        if (current.type !== "directory") {
          return null;
        }

        return Object.keys(current.contents)
          .map((name) => {
            const item = current.contents[name];
            return `<span class="${
              item.type === "directory" ? "blue" : "green"
            }">${name}</span>`;
          })
          .join("  ");
      }

      function getFileContent(path) {
        // Resolve the path relative to current directory
        const resolvedPath = resolvePath(currentDirectory, path);
        const parts = resolvedPath.split("/").filter(Boolean);
        let current = fileSystem["/"];

        // Handle absolute paths (starting with /)
        if (path.startsWith("/")) {
          const absoluteParts = path.split("/").filter(Boolean);
          for (const part of absoluteParts) {
            if (!current.contents[part]) {
              return null;
            }
            current = current.contents[part];
          }
        } else {
          // Handle relative paths
          for (const part of parts) {
            if (!current.contents[part]) {
              return null;
            }
            current = current.contents[part];
          }
        }

        if (current.type !== "file") {
          return null;
        }

        return current.content;
      }

      function formatPrompt(path) {
        return path === "/" ? ">" : path + ">";
      }

      function getAutocompleteSuggestions(input) {
        const parts = input.split(" ");
        const command = parts[0];
        const path = parts[1] || "";

        if (parts.length === 1) {
          // Command completion
          return Object.keys(commands).filter((cmd) => cmd.startsWith(command));
        } else {
          // Path completion
          const currentPath = getCurrentPath();
          let current = fileSystem["/"];
          let prefix = "";
          let searchPrefix = "";

          // Handle path with directory
          if (path.includes("/")) {
            const lastSlashIndex = path.lastIndexOf("/");
            prefix = path.substring(0, lastSlashIndex + 1);
            searchPrefix = path.substring(lastSlashIndex + 1);

            // Navigate to the parent directory
            const dirPath = resolvePath(currentPath, prefix);
            const dirParts = dirPath.split("/").filter(Boolean);
            for (const part of dirParts) {
              if (!current.contents[part]) {
                return [];
              }
              current = current.contents[part];
            }
          } else {
            // Handle current directory completion
            const resolvedPath = resolvePath(currentPath, "");
            const pathParts = resolvedPath.split("/").filter(Boolean);

            // Navigate to current directory
            for (const part of pathParts) {
              if (!current.contents[part]) {
                return [];
              }
              current = current.contents[part];
            }

            searchPrefix = path;
          }

          // Get suggestions from the current directory
          return Object.keys(current.contents)
            .filter((name) => name.startsWith(searchPrefix))
            .map((name) => {
              const item = current.contents[name];
              return prefix + (item.type === "directory" ? `${name}/` : name);
            });
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const terminal = document.getElementById("terminal-output");
        const input = document.getElementById("terminal-input");
        const inputContainer = document.getElementById("input-container");

        // Auto-focus input
        input.focus();

        function updatePrompt() {
          const prompt = `<span class="red">user@commit.fund</span>:${formatPrompt(
            currentDirectory
          )} `;
          inputContainer.innerHTML =
            prompt +
            `<input type="text" id="terminal-input" autocomplete="off" />`;
          document.getElementById("terminal-input").focus();
        }

        // Add booting messages
        const bootMessageLines = [
          "System loading...<br>",
          new Date().toString() + "<br>",
          "Thanks for your interest in >commit<br>",
          "Ready. <br> Type 'help' to get started.<br><br>",
        ];

        // Function to display boot messages with delay
        function displayBootMessages(index = 0) {
          if (index < bootMessageLines.length) {
            terminal.innerHTML += bootMessageLines[index];
            terminal.scrollTop = terminal.scrollHeight;
            setTimeout(() => displayBootMessages(index + 1), 500);
          } else {
            // After boot messages, show neofetch
            setTimeout(() => {
              terminal.innerHTML += `<p class="command-prompt"><span class="red">user@commit.fund</span>:~></p>`;
              terminal.innerHTML += `<div class="command-output">${commands.neofetch.execute()}</div>`;
              // Show the input container after neofetch
              document
                .getElementById("input-container")
                .classList.remove("hidden");
              // Focus the input field
              document.getElementById("terminal-input").focus();
            }, 500);
          }
        }

        // Start displaying boot messages
        displayBootMessages();

        // Handle input
        inputContainer.addEventListener("keydown", async (event) => {
          const input = event.target;
          if (event.key === "Tab") {
            event.preventDefault();
            const suggestions = getAutocompleteSuggestions(input.value);

            if (suggestions.length === 1) {
              const parts = input.value.split(" ");
              if (parts.length === 1) {
                input.value = suggestions[0] + " ";
              } else {
                const prefix = parts.slice(0, -1).join(" ");
                input.value = `${prefix} ${suggestions[0]}`;
              }
            }
          } else if (event.key === "Enter") {
            const parts = input.value.trim().split(" ");
            const command = parts[0].toLowerCase();
            const args = parts.slice(1);

            if (command) {
              if (isWaitingForEmail) {
                // Handle email submission
                const resultElement = document.getElementById("email-result");
                try {
                  const response = await fetch(
                    "https://commit-api.rrw.ovh/email",
                    {
                      method: "POST",
                      headers: {
                        "Content-Type": "application/json",
                      },
                      body: JSON.stringify({ email: command }),
                    }
                  );

                  const data = await response.json();
                  if (data?.ok) {
                    resultElement.innerText = "subscribed!";
                    resultElement.className = "green";
                    isWaitingForEmail = false;
                  } else {
                    resultElement.innerText =
                      "an error occurred please try again: " + data?.error;
                    resultElement.className = "red";
                    input.value = "";
                    input.focus();
                    return;
                  }
                } catch (error) {
                  resultElement.innerText =
                    "an error occurred please try again";
                  resultElement.className = "red";
                  return;
                }
              } else if (isWaitingForGithub) {
                const resultElement = document.getElementById("github-result");
                if (command.toUpperCase() === "Y") {
                  window.open("https://github.com/redriverwest", "_blank");
                }
                isWaitingForGithub = false;
                // Hide the prompt after handling response
                document.getElementById("github-prompt").style.display = "none";
                input.value = "";
                input.focus();
                return;
              } else {
                // Handle normal commands
                commandHistory.push(input.value);
                historyIndex = commandHistory.length;

                // Add command to output
                terminal.innerHTML += `<p class="command-prompt"><span class="red">user@commit.fund</span>:${formatPrompt(
                  currentDirectory
                )} ${input.value}</p>`;

                // Execute command
                if (commands[command]) {
                  const output = commands[command].execute(args);
                  if (output) {
                    terminal.innerHTML += `<div class="command-output">${output}</div>`;
                  }
                  if (commands[command].isInteractiveEmail) {
                    isWaitingForEmail = true;
                  }
                  if (commands[command].isInteractiveGithub) {
                    isWaitingForGithub = true;
                  }
                } else {
                  terminal.innerHTML += `<div class="command-output">${commands.help.execute()}</div>`;
                }
              }

              // Reset input
              input.value = "";
              updatePrompt();

              // Scroll to bottom
              terminal.scrollTop = terminal.scrollHeight;
            }
          } else if (event.key === "ArrowUp") {
            event.preventDefault();
            if (historyIndex > 0) {
              historyIndex--;
              input.value = commandHistory[historyIndex];
            }
          } else if (event.key === "ArrowDown") {
            event.preventDefault();
            if (historyIndex < commandHistory.length - 1) {
              historyIndex++;
              input.value = commandHistory[historyIndex];
            } else {
              historyIndex = commandHistory.length;
              input.value = "";
            }
          }
        });
      });
    </script>
