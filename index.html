                    <span class="red">cokOOO000KKXXXNN</span>NWWWMMMMMMMMMMMMMMMMMM<span class="red">k:</span><br/>
                    <span class="red">ccdxxkO00KXN</span>WWMMMMMMMMMMMMMMMMMMMMMMMM<span class="red">k:</span><br/>
                    <span class="red">clolcc::::::::ccloddxkO00KXN</span>NWMMMMMMMM<span class="red">k:</span><br/>
                    <span class="red">ck</span>MMMMWWNXKK<span class="red">0Okxxdollc::::::::ccloddxko:</span><br/>

            return neofetchContent;
          },
          description: "Display system information",
        },
        ls: {
          execute: (args) => {
            const currentPath = getCurrentPath();
            const path = args[0] || currentPath;
            const content = getDirectoryContent(path);
            return `<div class="ls-output">${content}</div>`;
          },
          description: "List directory contents",
        },
        cat: {
          execute: (args) => {
            if (!args[0]) {
              return "Usage: cat <file>";
            }
            const filePath = args[0];
            const content = getFileContent(filePath);
            if (content === null) {
              return `cat: ${filePath}: No such file or directory`;
            }
            return `<pre>${content}</pre>`;
          },
          description: "Display file contents",
        },
        cd: {
          execute: (args) => {
            if (!args[0]) {
              currentDirectory = "/";
              return "";
            }
            const targetPath = args[0];
            const newPath = resolvePath(currentDirectory, targetPath);
            if (isValidDirectory(newPath)) {
              currentDirectory = newPath;
              return "";
            }
            return `cd: ${targetPath}: No such directory`;
          },
          description: "Change directory",
        },
        email: {
          execute: () => {
            return `
              <div id="email-prompt">
                <p>Enter your email to subscribe to our mailing list:</p>
                <p id="email-result" class="hidden"></p>
              </div>`;
          },
          description: "Subscribe to our mailing list",
          isInteractive: true,
        },
        help: {
          execute: () => {
            return `
              <p>Available commands:</p>
              <p><span class="green">neofetch</span> - ${commands.neofetch.description}</p>
              <p><span class="green">email</span> - ${commands.email.description}</p>
              <p><span class="green">help</span> - Show this help message</p>
              <p><span class="green">clear</span> - Clear the terminal</p>`;
          },
          description: "Show help message",
        },
        clear: {
          execute: () => {
            document.getElementById("terminal-output").innerHTML = "";
            return "";
          },
          description: "Clear the terminal",
        },
      };

      let commandHistory = [];
      let historyIndex = -1;
      let isWaitingForEmail = false;
      let currentDirectory = "/";

      // File system structure
      const fileSystem = {
        "/": {
          type: "directory",
          contents: {
            team: {
              type: "directory",
              contents: {
                "abel.txt": {
                  type: "file",
                  content: `Name: Abel
Role: General Partner
Location: Paris, France
Expertise: Open Source, Developer Tools, Community Building`,
                },
                "olivier.txt": {
                  type: "file",
                  content: `Name: Olivier
Role: General Partner
Location: Paris, France
Expertise: Open Source, Developer Tools, Community Building`,
                },
              },
            },
            portfolio: {
              type: "directory",
              contents: {
                "company.txt": {
                  type: "file",
                  content: `Our portfolio companies are building the future of open source software.

Each company in our portfolio shares our vision of creating sustainable, community-driven software that solves real problems for developers and businesses.

We focus on:
- Developer Tools
- Open Source Infrastructure
- Community-driven Software
- Enterprise Solutions`,
                },
              },
            },
          },
        },
      };

      function getCurrentPath() {
        return currentDirectory;
      }

      function resolvePath(current, target) {
        if (target.startsWith("/")) {
          return target;
        }

        // Handle special directories
        if (target === ".") {
          return current;
        }
        if (target === "..") {
          const parts = current.split("/").filter(Boolean);
          parts.pop();
          return parts.length ? `/${parts.join("/")}` : "/";
        }

        // Handle relative paths with ../
        if (target.startsWith("../")) {
          const parts = current.split("/").filter(Boolean);
          parts.pop();
          const remainingPath = target.slice(3);
          return parts.length
            ? `/${parts.join("/")}/${remainingPath}`
            : `/${remainingPath}`;
        }

        return current === "/" ? `/${target}` : `${current}/${target}`;
      }

      function isValidDirectory(path) {
        const parts = path.split("/").filter(Boolean);
        let current = fileSystem["/"];

        for (const part of parts) {
          if (
            !current.contents[part] ||
            current.contents[part].type !== "directory"
          ) {
            return false;
          }
          current = current.contents[part];
        }
        return true;
      }

      function getDirectoryContent(path) {
        // Resolve the path relative to current directory
        const resolvedPath = resolvePath(currentDirectory, path);
        const parts = resolvedPath.split("/").filter(Boolean);
        let current = fileSystem["/"];

        for (const part of parts) {
          if (!current.contents[part]) {
            return null;
          }
          current = current.contents[part];
        }

        if (current.type !== "directory") {
          return null;
        }

        return Object.keys(current.contents)
          .map((name) => {
            const item = current.contents[name];
            return `<span class="${
              item.type === "directory" ? "blue" : "green"
            }">${name}</span>`;
          })
          .join("  ");
      }

      function getFileContent(path) {
        // Resolve the path relative to current directory
        const resolvedPath = resolvePath(currentDirectory, path);
        const parts = resolvedPath.split("/").filter(Boolean);
        let current = fileSystem["/"];

        // Handle absolute paths (starting with /)
        if (path.startsWith("/")) {
          const absoluteParts = path.split("/").filter(Boolean);
          for (const part of absoluteParts) {
            if (!current.contents[part]) {
              return null;
            }
            current = current.contents[part];
          }
        } else {
          // Handle relative paths
          for (const part of parts) {
            if (!current.contents[part]) {
              return null;
            }
            current = current.contents[part];
          }
        }

        if (current.type !== "file") {
          return null;
        }

        return current.content;
      }

      function formatPrompt(path) {
        return path === "/" ? "~" : path;
      }

      function getAutocompleteSuggestions(input) {
        const parts = input.split(" ");
        const command = parts[0];
        const path = parts[1] || "";

        if (parts.length === 1) {
          // Command completion
          return Object.keys(commands).filter((cmd) => cmd.startsWith(command));
        } else {
          // Path completion
          const currentPath = getCurrentPath();
          let current = fileSystem["/"];
          let prefix = "";
          let searchPrefix = "";

          // Handle path with directory
          if (path.includes("/")) {
            const lastSlashIndex = path.lastIndexOf("/");
            prefix = path.substring(0, lastSlashIndex + 1);
            searchPrefix = path.substring(lastSlashIndex + 1);

            // Navigate to the parent directory
            const dirPath = resolvePath(currentPath, prefix);
            const dirParts = dirPath.split("/").filter(Boolean);
            for (const part of dirParts) {
              if (!current.contents[part]) {
                return [];
              }
              current = current.contents[part];
            }
          } else {
            // Handle current directory completion
            const resolvedPath = resolvePath(currentPath, "");
            const pathParts = resolvedPath.split("/").filter(Boolean);

            // Navigate to current directory
            for (const part of pathParts) {
              if (!current.contents[part]) {
                return [];
              }
              current = current.contents[part];
            }

            searchPrefix = path;
          }

          // Get suggestions from the current directory
          return Object.keys(current.contents)
            .filter((name) => name.startsWith(searchPrefix))
            .map((name) => {
              const item = current.contents[name];
              return prefix + (item.type === "directory" ? `${name}/` : name);
            });
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const terminal = document.getElementById("terminal-output");
        const input = document.getElementById("terminal-input");
        const inputContainer = document.getElementById("input-container");

        // Auto-focus input
        input.focus();

        function updatePrompt() {
          const prompt = `<span class="green">user@commit.fund</span>:${formatPrompt(
            currentDirectory
          )}$ `;
          inputContainer.innerHTML =
            prompt +
            `<input type="text" id="terminal-input" autocomplete="off" />`;
          document.getElementById("terminal-input").focus();
        }

        // Handle input
        inputContainer.addEventListener("keydown", async (event) => {
          const input = event.target;
          if (event.key === "Tab") {
            event.preventDefault();
            const suggestions = getAutocompleteSuggestions(input.value);

            if (suggestions.length === 1) {
              const parts = input.value.split(" ");
              if (parts.length === 1) {
                input.value = suggestions[0] + " ";
              } else {
                const prefix = parts.slice(0, -1).join(" ");
                input.value = `${prefix} ${suggestions[0]}`;
              }
            }
          } else if (event.key === "Enter") {
            const parts = input.value.trim().split(" ");
            const command = parts[0].toLowerCase();
            const args = parts.slice(1);

            if (command) {
              if (isWaitingForEmail) {
                // Handle email submission
                const resultElement = document.getElementById("email-result");
                try {
                  const response = await fetch(
                    "https://commit-api.rrw.ovh/email",
                    {
                      method: "POST",
                      headers: {
                        "Content-Type": "application/json",
                      },
                      body: JSON.stringify({ email: command }),
                    }
                  );

                  const data = await response.json();
                  if (data?.ok) {
                    resultElement.innerText = "subscribed!";
                    resultElement.className = "green";
                    isWaitingForEmail = false;
                  } else {
                    resultElement.innerText =
                      "an error occurred please try again: " + data?.error;
                    resultElement.className = "red";
                    input.value = "";
                    input.focus();
                    return;
                  }
                } catch (error) {
                  resultElement.innerText =
                    "an error occurred please try again";
                  resultElement.className = "red";
                  return;
                }
              } else {
                // Handle normal commands
                commandHistory.push(input.value);
                historyIndex = commandHistory.length;

                // Add command to output
                terminal.innerHTML += `<p class="command-prompt"><span class="green">user@commit.fund</span>:${formatPrompt(
                  currentDirectory
                )}$ ${input.value}</p>`;

                // Execute command
                if (commands[command]) {
                  const output = commands[command].execute(args);
                  if (output) {
                    terminal.innerHTML += `<div class="command-output">${output}</div>`;
                  }
                  if (commands[command].isInteractive) {
                    isWaitingForEmail = true;
                  }
                } else {
                  terminal.innerHTML += `<div class="command-output">${commands.help.execute()}</div>`;
                }
              }

              // Reset input
              input.value = "";
              updatePrompt();

              // Scroll to bottom
              terminal.scrollTop = terminal.scrollHeight;
            }
          } else if (event.key === "ArrowUp") {
            event.preventDefault();
            if (historyIndex > 0) {
              historyIndex--;
              input.value = commandHistory[historyIndex];
            }
          } else if (event.key === "ArrowDown") {
            event.preventDefault();
            if (historyIndex < commandHistory.length - 1) {
              historyIndex++;
              input.value = commandHistory[historyIndex];
            } else {
              historyIndex = commandHistory.length;
              input.value = "";
            }
          }
        });

        // Auto-run neofetch on startup
        setTimeout(() => {
          terminal.innerHTML += `<p class="command-prompt"><span class="green">user@commit.fund</span>:~$ neofetch</p>`;
          terminal.innerHTML += `<div class="command-output">${commands.neofetch.execute()}</div>`;
        }, 500);
      });
    </script>
