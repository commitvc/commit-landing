      function getCurrentPath() {
        return currentDirectory;
      }

      function resolvePath(current, target) {
        if (target.startsWith("/")) {
          return target;
        }

        // Handle special directories
        if (target === ".") {
          return current;
        }
        if (target === "..") {
          const parts = current.split("/").filter(Boolean);
          parts.pop();
          return parts.length ? `/${parts.join("/")}` : "/";
        }

        // Handle relative paths with ../
        if (target.startsWith("../")) {
          const parts = current.split("/").filter(Boolean);
          parts.pop();
          const remainingPath = target.slice(3);
          return parts.length
            ? `/${parts.join("/")}/${remainingPath}`
            : `/${remainingPath}`;
        }

        return current === "/" ? `/${target}` : `${current}/${target}`;
      }

      function isValidDirectory(path) {
        const parts = path.split("/").filter(Boolean);
        let current = fileSystem["/"];

        for (const part of parts) {
          if (
            !current.contents[part] ||
            current.contents[part].type !== "directory"
          ) {
            return false;
          }
          current = current.contents[part];
        }
        return true;
      }

      function getDirectoryContent(path) {
        // Resolve the path relative to current directory
        const resolvedPath = resolvePath(currentDirectory, path);
        const parts = resolvedPath.split("/").filter(Boolean);
        let current = fileSystem["/"];

        for (const part of parts) {
          if (!current.contents[part]) {
            return null;
          }
          current = current.contents[part];
        }

        if (current.type !== "directory") {
          return null;
        }

        // Get all entries and separate directories from files
        const entries = Object.entries(current.contents);
        const directories = entries
          .filter(([_, item]) => item.type === "directory")
          .map(([name]) => name)
          .sort();
        const files = entries
          .filter(([_, item]) => item.type === "file")
          .map(([name]) => name)
          .sort();
        
        // Combine directories first, then files
        return [...directories.map(name => 
          `&nbsp;&nbsp;&nbsp;&nbsp;<span class="blue">${name}</span><br>`
        ), ...files.map(name => 
          `&nbsp;&nbsp;&nbsp;&nbsp;<span class="green">${name}</span><br>`
        )].join("");
      }

      function getFileContent(path) {
        // Resolve the path relative to current directory
        const resolvedPath = resolvePath(currentDirectory, path);
        const parts = resolvedPath.split("/").filter(Boolean);
        let current = fileSystem["/"];

        // Handle absolute paths (starting with /)
        if (path.startsWith("/")) {
          const absoluteParts = path.split("/").filter(Boolean);
          for (const part of absoluteParts) {
            if (!current.contents[part]) {
              return null;
            }
            current = current.contents[part];
          }
        } else {
          // Handle relative paths
          for (const part of parts) {
            if (!current.contents[part]) {
              return null;
            }
            current = current.contents[part];
          }
        }

        if (current.type !== "file") {
          return null;
        }

        return current.content;
      }

      function formatPrompt(path) {
        const host = `<span class="red">user@commit.fund</span> `;
        return path === "/" ? `${host}>` : `${host}${path} >`;
      }

      function updatePromptShadow() {
        const inputCont = document.getElementById("input-container");
        const shadow = document.getElementById("prompt-shadow");
        const cliOut = document.getElementById("cli-output");
        const tabOut = document.getElementById("tab-content");
        if (!inputCont) return;
        // Cover the full prompt zone + gradient fade above it
        if (shadow && inputCont) {
          const bcr = inputCont.getBoundingClientRect();
          const inputCover = Math.round(window.innerHeight - bcr.top); // solid bg height = input top → viewport bottom
          const fadeHeight = 8; // very short fade = crisp edge
          const totalHeight = inputCover + fadeHeight;
          shadow.style.height = totalHeight + "px";
          // Solid backing covers the prompt (z-index 9 < prompt 10, so hidden)
          // Visible gradient: near-black → transparent over 14px for a sharp, intense edge
          shadow.style.background = `linear-gradient(to top, #313445 ${inputCover}px, rgb(20, 21, 30) ${inputCover}px, transparent ${totalHeight}px)`;
        }
        const tabVisible = tabOut && tabOut.style.display !== "none";
        const active = (tabVisible && tabOut.scrollHeight > tabOut.clientHeight)
          ? tabOut
          : (cliOut && cliOut.scrollHeight > cliOut.clientHeight) ? cliOut : null;
        if (!active) {
          inputCont.classList.remove("prompt-shadow");
          if (shadow) shadow.classList.remove("active");
          return;
        }
        const gap = active.scrollHeight - active.scrollTop - active.clientHeight;
        if (gap > 5) {
          inputCont.classList.add("prompt-shadow");
          if (shadow) shadow.classList.add("active");
        } else {
          inputCont.classList.remove("prompt-shadow");
          if (shadow) shadow.classList.remove("active");
        }
      }

      function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function buildFileTree(node, path, prefix, isLast) {
        let html = "";
        const entries = Object.entries(node.contents);
        const dirs = entries.filter(([name, v]) => v.type === "directory" && name !== "private").sort((a, b) => a[0].localeCompare(b[0]));
        const files = entries.filter(([_, v]) => v.type === "file").sort((a, b) => a[0].localeCompare(b[0]));
        const sorted = [...dirs, ...files];

        sorted.forEach(([name, item], i) => {
          const isLastItem = i === sorted.length - 1;
          const fullPath = path === "/" ? `/${name}` : `${path}/${name}`;
          const connector = isLastItem ? "└── " : "├── ";
          const childPrefix = prefix + (isLastItem ? "    " : "│   ");

          if (item.type === "directory") {
            const isExpanded = fileTreeState[fullPath] === true;
            const toggle = isExpanded ? "−" : "+";
            html += `<div class="tree-item" onclick="toggleDir('${fullPath}')"><span class="tree-prefix">${prefix}${connector}</span><span class="tree-toggle">${toggle}</span> <span class="tree-dir">${name}/</span></div>`;
            if (isExpanded) {
              html += buildFileTree(item, fullPath, childPrefix, isLastItem);
            }
          } else {
            html += `<div class="tree-item" onclick="viewFile('${fullPath}')"><span class="tree-prefix">${prefix}${connector}</span><span class="tree-file">${name}</span></div>`;
          }
        });
        return html;
      }

        fileTreeState[path] = !fileTreeState[path];

        const content = getFileContent(path);

        let rendered;
        if (path.includes("abel.txt") || path.includes("max.txt") || path.includes("olivier.txt") || path.includes("alessandro.txt")) {

        } else if (path.includes("uma.txt") || path.includes("stealth-") || path.includes("pre-commit/")) {

        } else if (path.includes("legal.txt")) {
          rendered = commands.legalNotice.execute(path);
        } else if (path.includes("/blog/") && path.endsWith(".txt")) {
          rendered = commands.blogPost.execute(path);
        } else {
          rendered = `<pre>${content}</pre>`;
        }

        const viewer = document.getElementById("file-viewer");
        if (viewer) {
          viewer.innerHTML = `<div class="file-viewer-header">── ${path} ──</div>${rendered}`;
          viewer.scrollIntoView({ behavior: "smooth" });
          const metricsEl = viewer.querySelector('[data-gh-fetch]');
          if (metricsEl) fetchGithubMetrics(metricsEl.dataset.ghFetch, metricsEl.dataset.pkg || '', metricsEl.id);
        }
      }

      function fmtNum(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
        return String(n);
      }

      async function fetchGithubMetrics(githubUrl, pkg, uid) {
        const match = githubUrl.match(/github\.com\/([^/]+\/[^/?#]+)/);
        if (!match) return;
        const repo = match[1].replace(/\/$/, '');
        try {
          const fetches = [
            fetch(`https://api.github.com/repos/${repo}`),
            fetch(`https://api.github.com/repos/${repo}/contributors?per_page=1&anon=1`),
          ];
          if (pkg) {
            const [registry, pkgName] = pkg.split(/:(.+)/);
            if (registry === 'npm') fetches.push(fetch(`https://api.npmjs.org/downloads/point/last-month/${encodeURIComponent(pkgName)}`));
            else if (registry === 'pypi') fetches.push(fetch(`https://pypistats.org/api/packages/${pkgName}/recent`));
            else fetches.push(Promise.resolve(null));
          }
          const [repoRes, contribRes, dlRes] = await Promise.all(fetches);
          const repoData = await repoRes.json();
          const stars = fmtNum(repoData.stargazers_count);
          let contributors = '–';
          const link = contribRes.headers.get('link');
          if (link) {
            const m = link.match(/[?&]page=(\d+)>; rel="last"/);
            if (m) contributors = fmtNum(parseInt(m[1]));
          } else {
            const arr = await contribRes.json();
            if (Array.isArray(arr)) contributors = fmtNum(arr.length);
          }
          let dlHtml = '';
          if (dlRes) {
            try {
              const dlData = await dlRes.json();
              const [registry] = pkg.split(':');
              const count = registry === 'npm' ? dlData.downloads : dlData.data?.last_month;
              if (count) dlHtml = `&nbsp;&nbsp;<span style="opacity:0.55">↓</span> ${fmtNum(count)}/mo`;
            } catch (_) {}
          }
          const el = document.getElementById(uid);
          if (el) el.innerHTML = `<span class="yellow">Adoption</span>&nbsp;&nbsp;<span style="opacity:0.55">☆</span> ${stars}&nbsp;&nbsp;<span style="opacity:0.55">◈</span> ${contributors}${dlHtml}`;
        } catch (_) {
          const el = document.getElementById(uid);
          if (el) el.textContent = '';
        }
      }

      function switchTab(tab, replace) {
        if (tab === currentTab && document.getElementById("tab-cli") && neofetchCollapsed) return;
        currentTab = tab;

        const tabs = ["cli", "portfolio", "team", "about", "blog"];
        tabs.forEach(t => {
          const el = document.getElementById(`tab-${t}`);
          if (!el) return;
          if (t === tab) {
            el.classList.add("tab-active");
          } else {
            el.classList.remove("tab-active");
          }
        });

        const cliHint = document.getElementById("cli-hint");
        const cliOutput = document.getElementById("cli-output");
        const tabContent = document.getElementById("tab-content");
        const inputContainer = document.getElementById("input-container");
        const tabNavContainer = document.querySelector(".tab-nav-container");
        const terminalEl = document.getElementById("terminal-output");
        const containerEl = document.querySelector(".container");

        // Collapse neofetch only on first tab switch (Option C)
        if (!neofetchCollapsed) {
          const collapsibles = document.querySelectorAll(".collapsible");
          collapsibles.forEach(el => el.classList.add("collapsed"));
          if (tabNavContainer) tabNavContainer.classList.add("tab-static");
          if (terminalEl) terminalEl.classList.add("tab-static-mode");
          if (containerEl) containerEl.classList.add("tab-static-mode");
          neofetchCollapsed = true;
          // Snap indicator after layout transition fully settles (gap + margin = 0.35s)
          setTimeout(() => moveTabIndicator(tab, true), 380);
        } else {
          // Smooth slide for subsequent switches
          moveTabIndicator(tab);
        }

        if (tab === "cli") {
          if (cliHint) cliHint.style.display = "none";
          if (cliOutput) cliOutput.style.display = "block";
          if (tabContent) tabContent.style.display = "none";
          inputContainer.classList.remove("hidden");
          const ti = document.getElementById("terminal-input");
          if (ti) ti.focus();
        } else {
          if (cliHint) cliHint.style.display = "none";
          if (cliOutput) cliOutput.style.display = "none";
          if (tabContent) {
            tabContent.style.display = "block";
            tabContent.innerHTML = "";
            fileTreeState = {};
            if (tab === "portfolio") renderPortfolio();
            else if (tab === "team") renderTeam();
            else if (tab === "about") renderAbout();
            else if (tab === "blog") renderBlog();
          }
          inputContainer.classList.add("hidden");
        }

        // Update URL
        const tabToSlug = { cli: "cli", portfolio: "companies", blog: "blog", team: "team", about: "about" };
        const slug = tabToSlug[tab] || tab;
        if (window.location.pathname !== `/${slug}`) {
          if (replace) {
            history.replaceState({ tab: tab }, "", `/${slug}`);
          } else {
            history.pushState({ tab: tab }, "", `/${slug}`);
          }
        }
      }

      function moveTabIndicator(tab, instant) {
        const indicator = document.getElementById("tab-indicator");
        const el = document.getElementById(`tab-${tab}`);
        const container = document.querySelector(".tab-nav-container");
        if (!indicator || !el || !container) return;
        const containerRect = container.getBoundingClientRect();
        const elRect = el.getBoundingClientRect();
        if (instant) {
          indicator.classList.add("no-transition");
          indicator.offsetHeight; // flush
        }
        indicator.style.left = (elRect.left - containerRect.left) + "px";
        indicator.style.width = elRect.width + "px";
        if (instant) {
          indicator.offsetHeight; // flush
          indicator.classList.remove("no-transition");
        }
      }

      function renderTabTree(rootPath) {
        const tabContent = document.getElementById("tab-content");
        if (!tabContent) return;

        let node = fileSystem["/"];
        const basePath = rootPath ? `/${rootPath}` : "/";
        if (rootPath) {
          const parts = rootPath.split("/").filter(Boolean);
          for (const part of parts) {
            if (!node.contents || !node.contents[part]) return;
            node = node.contents[part];
          }
        }

        let html = '<div class="file-tree">';
        html += buildFileTree(node, basePath, "", true);
        html += '</div>';
        html += '<div id="file-viewer" class="file-viewer"></div>';
        tabContent.innerHTML = html;
      }

        const inputCont = document.getElementById("input-container");
        if (!document.getElementById("cli-output")) {
          const cliOutputDiv = document.createElement("div");
          cliOutputDiv.id = "cli-output";
          containerDiv.insertBefore(cliOutputDiv, inputCont);
        }
        // Prompt lives inside cli-output so it flows after content and sticks to bottom on scroll
        const cliOutputEl = document.getElementById("cli-output");
        if (inputCont.parentElement === containerDiv) {
          cliOutputEl.appendChild(inputCont);
        }
        // Attach scroll listener each time (idempotent — same handler ref is deduplicated by addEventListener)
        cliOutputEl.addEventListener("scroll", updatePromptShadow);
        window.addEventListener("resize", updatePromptShadow);
        // Create the fixed shadow div once (lives on body, outside any overflow clip)
        if (!document.getElementById("prompt-shadow")) {
          const shadowDiv = document.createElement("div");
          shadowDiv.id = "prompt-shadow";
          document.body.appendChild(shadowDiv);
        }
        if (!document.getElementById("tab-content")) {
          const tabContentDiv = document.createElement("div");
          tabContentDiv.id = "tab-content";
          tabContentDiv.style.display = "none";
          containerDiv.appendChild(tabContentDiv);
          tabContentDiv.addEventListener("scroll", updatePromptShadow);
        }

        // Set CLI as active tab without collapsing (landing state)
        currentTab = "cli";
        const cliTabEl = document.getElementById("tab-cli");
        if (cliTabEl) cliTabEl.classList.add("tab-active");
        // Snap indicator to CLI instantly (no transition)
        moveTabIndicator("cli", true);
        // Show prompt + CLI output
        const landingInput = document.getElementById("input-container");
        if (landingInput) landingInput.classList.remove("hidden");
        const landingCliOutput = document.getElementById("cli-output");
        if (landingCliOutput) landingCliOutput.style.display = "block";
        const landingTermInput = document.getElementById("terminal-input");
        if (landingTermInput) landingTermInput.focus();
      }

      function getAutocompleteSuggestions(input) {
        const parts = input.split(" ");
        const command = parts[0];
        const path = parts[1] || "";

        if (parts.length === 1) {
          // Command completion
          return Object.keys(commands).filter((cmd) => cmd.startsWith(command));
        } else {
          // Path completion
          const currentPath = getCurrentPath();
          let current = fileSystem["/"];
          let prefix = "";
          let searchPrefix = "";

          // Handle path with directory
          if (path.includes("/")) {
            const lastSlashIndex = path.lastIndexOf("/");
            prefix = path.substring(0, lastSlashIndex + 1);
            searchPrefix = path.substring(lastSlashIndex + 1);

            // Navigate to the parent directory
            const dirPath = resolvePath(currentPath, prefix);
            const dirParts = dirPath.split("/").filter(Boolean);
            for (const part of dirParts) {
              if (!current.contents[part]) {
                return [];
              }
              current = current.contents[part];
            }
          } else {
            // Handle current directory completion
            const resolvedPath = resolvePath(currentPath, "");
            const pathParts = resolvedPath.split("/").filter(Boolean);

            // Navigate to current directory
            for (const part of pathParts) {
              if (!current.contents[part]) {
                return [];
              }
              current = current.contents[part];
            }

            searchPrefix = path;
          }

          // Get suggestions from the current directory
          return Object.keys(current.contents)
            .filter((name) => name.startsWith(searchPrefix))
            .map((name) => {
              const item = current.contents[name];
              return prefix + (item.type === "directory" ? `${name}/` : name);
            });
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const terminal = document.getElementById("terminal-output");
        const input = document.getElementById("terminal-input");
        const inputContainer = document.getElementById("input-container");

        // Auto-focus input
        input.focus();
        input.addEventListener("input", () => resizeInput(input));
        input.addEventListener("keyup", () => updateCursorPosition(input));
        input.addEventListener("click", () => updateCursorPosition(input));
        input.addEventListener("focus", () => { const c = document.getElementById("cursor"); if (c) c.classList.remove("cursor-hidden"); });
        input.addEventListener("blur", () => { const c = document.getElementById("cursor"); if (c) c.classList.add("cursor-hidden"); });

        window.addEventListener("scroll", updatePromptShadow);

        // Re-focus terminal input when clicking anywhere in the terminal
        terminal.addEventListener("click", (e) => {
          if (e.target.tagName !== "A" && e.target.tagName !== "INPUT") {
            const inp = document.getElementById("terminal-input");
            if (inp) inp.focus();
          }
        });

        function resizeInput(el) {
          el.style.width = el.value.length + "ch";
          updateCursorPosition(el);
        }

        function updateCursorPosition(el) {
          const cursor = document.getElementById("cursor");
          if (!cursor) return;
          const pos = el.selectionStart || 0;
          const len = el.value.length;
          // Position underscore: offset from end of input by (len - pos) characters
          cursor.style.marginLeft = -(len - pos) + "ch";
        }

        function updatePrompt() {
          const prompt = `${formatPrompt(currentDirectory)}`;
          inputContainer.innerHTML =
            prompt +
            `<input type="text" id="terminal-input" autocomplete="off" /><span class="cursor-blink" id="cursor">_</span>`;
          const newInput = document.getElementById("terminal-input");
          newInput.addEventListener("input", () => resizeInput(newInput));
          newInput.addEventListener("keyup", () => updateCursorPosition(newInput));
          newInput.addEventListener("click", () => updateCursorPosition(newInput));
          newInput.addEventListener("focus", () => { const c = document.getElementById("cursor"); if (c) c.classList.remove("cursor-hidden"); });
          newInput.addEventListener("blur", () => { const c = document.getElementById("cursor"); if (c) c.classList.add("cursor-hidden"); });
          newInput.focus({ preventScroll: true });
        }

        // Add booting messages
        const bootMessageLines = [
          "System loading...<br>",
          new Date().toString() + "<br>",
          "Thanks for your interest in >commit<br>",
          "Ready. <br><br>",
        ];


        // Function to display boot messages with delay
        function displayBootMessages(index = 0) {
          if (index === 0) {
            terminal.innerHTML += `<div id="boot-messages" class="collapsible">`;
          }
          if (index < bootMessageLines.length) {
            document.getElementById("boot-messages").innerHTML += bootMessageLines[index];
            terminal.scrollTop = terminal.scrollHeight;
            setTimeout(() => displayBootMessages(index + 1), 500);
          } else {
            // After boot messages, show neofetch + mode switcher
            setTimeout(() => {
              renderWelcome();
            }, 500);
          }
        }

        // Handle browser back/forward
        window.addEventListener("popstate", (e) => {
          if (e.state && e.state.tab) {
            switchTab(e.state.tab);
          } else {
            // Back to landing — reload to get the full neofetch view
            window.location.reload();
          }
        });

        // Check if arriving on a subpage — skip boot animation
        const initTab = sessionStorage.getItem('initTab');
        if (initTab) sessionStorage.removeItem('initTab');

        if (initTab) {
          // Subpage: skip boot, collapse instantly (no transition flash)
          document.body.classList.add("no-init-transition");
          terminal.innerHTML += `<div id="boot-messages" class="collapsible"></div>`;
          renderWelcome();
          switchTab(initTab, true);
          requestAnimationFrame(() => document.body.classList.remove("no-init-transition"));
        } else {
          // Landing: full boot animation
          displayBootMessages();
        }

        // Handle input
        inputContainer.addEventListener("keydown", async (event) => {
          const input = event.target;
          if (event.key === "Tab") {
            event.preventDefault();
            const suggestions = getAutocompleteSuggestions(input.value);

            if (suggestions.length === 1) {
              const parts = input.value.split(" ");
              if (parts.length === 1) {
                input.value = suggestions[0] + " ";
              } else {
                const prefix = parts.slice(0, -1).join(" ");
                input.value = `${prefix} ${suggestions[0]}`;
              }
            }
          } else if (event.key === "Enter") {
            const parts = input.value.trim().split(" ");
            const command = parts[0].toLowerCase();
            const args = parts.slice(1);

            if (command) {
              if (isWaitingForEmail) {
                // Handle email submission
                const currentPrompt = document.querySelector(
                  "#email-prompt-" +
                    Array.from(
                      document.querySelectorAll('[id^="email-prompt-"]')
                    )
                      .pop()
                      .id.split("-")
                      .pop()
                );
                const resultElement = currentPrompt.querySelector(
                  '[id^="email-result-"]'
                );
                try {
                  const response = await fetch(
                    "https://commit-api.rrw.ovh/email",
                    {
                      method: "POST",
                      headers: {
                        "Content-Type": "application/json",
                      },
                      body: JSON.stringify({ email: command }),
                    }
                  );

                  const data = await response.json();
                  if (data?.ok) {
                    resultElement.innerText = "subscribed!";
                    resultElement.className = "green";
                    isWaitingForEmail = false;
                    // Add auto-scroll for success message
                    resultElement.scrollIntoView({ behavior: "smooth" });
                  } else {
                    resultElement.innerText =
                      "an error occurred please try again: " + data?.error;
                    resultElement.className = "red";
                    input.value = "";
                    isWaitingForEmail = false;
                    input.focus();
                    // Add auto-scroll for error message
                    resultElement.scrollIntoView({ behavior: "smooth" });
                    return;
                  }
                } catch (error) {
                  resultElement.innerText =
                    "an error occurred please try again";
                  resultElement.className = "red";
                  input.value = "";
                  isWaitingForEmail = false;
                  input.focus();
                  // Add auto-scroll for error message
                  resultElement.scrollIntoView({ behavior: "smooth" });
                  return;
                }
              } else {
                // Handle normal commands
                if (commands[command]) {
                  // Add valid command to history
                  commandHistory.push(input.value);
                  historyIndex = commandHistory.length;

                  // Show the command in cli-output, inserted before the prompt
                  const promptEl = document.getElementById("input-container");
                  promptEl.insertAdjacentHTML('beforebegin', `<p class="command-prompt">${formatPrompt(currentDirectory)}${escapeHtml(input.value)}</p>`);

                  const output = commands[command].execute(args);
                  promptEl.insertAdjacentHTML('beforebegin', `<div class="command-output">${output || ''}</div>`);
                  if (commands[command].isInteractiveEmail) {
                    isWaitingForEmail = true;
                  }
                } else {
                  // For unknown commands, show error and help
                  const promptEl = document.getElementById("input-container");
                  promptEl.insertAdjacentHTML('beforebegin', `<p class="command-prompt">${formatPrompt(currentDirectory)}${escapeHtml(input.value)}</p>`);
                  promptEl.insertAdjacentHTML('beforebegin', `<div class="command-output">Command '${escapeHtml(command)}' not found.<br><br>${commands.help.execute([])}</div>`);
                }
              }

              // Reset input
              input.value = "";

              // Scroll to bottom BEFORE updatePrompt so focus() inside it doesn't
              // trigger a scroll-into-view on a stale layout (the source of the jump glitch)
              const cliScrollEl = document.getElementById("cli-output");
              if (cliScrollEl) cliScrollEl.scrollTop = cliScrollEl.scrollHeight;
              terminal.scrollTop = terminal.scrollHeight;

              updatePrompt();
              window.scrollTo({ top: document.body.scrollHeight });
            }
          } else if (event.key === "ArrowUp") {
            event.preventDefault();
            if (historyIndex > 0) {
              historyIndex--;
              input.value = commandHistory[historyIndex];
              resizeInput(input);
            }
          } else if (event.key === "ArrowDown") {
            event.preventDefault();
            if (historyIndex < commandHistory.length - 1) {
              historyIndex++;
              input.value = commandHistory[historyIndex];
              resizeInput(input);
            } else {
              historyIndex = commandHistory.length;
              input.value = "";
              resizeInput(input);
            }
          }
        });
      });
    </script>
